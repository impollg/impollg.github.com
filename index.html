<!doctype html>
<!-- Lo que ibas a hacer · v2.3 (imagen real + fantasmas deformados, 33 puntos) -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Lo que ibas a hacer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; color: #ddd; }
  #cam { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #stage { position: fixed; left: 0; top: 0; display: block; background: #000; }
  #ui { position: fixed; left: 0; top: 0; display: block; pointer-events: none; z-index: 2; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; cursor: pointer; z-index: 5; text-align: center; padding: 24px; }
  #start .t { position: absolute; left: 18px; bottom: 18px; color: #555; font-size: 13px; }
  #start .ver { position: absolute; right: 18px; bottom: 18px; color: #2c2c2c; font-size: 11px; letter-spacing: .06em; }
  #start .hint { color: #444; font-size: 13px; letter-spacing: .04em; }
  #start .err { color: #b66; font-size: 13px; margin-top: 10px; max-width: 420px; line-height: 1.5; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #000; color: #555; font-size: 14px; z-index: 6; }
  #hotspot { position: fixed; top: 0; right: 0; width: 72px; height: 72px; z-index: 10; }
  #panel { position: fixed; inset: 0; z-index: 20; background: rgba(10,10,10,.97); overflow-y: auto;
    -webkit-overflow-scrolling: touch; touch-action: pan-y; -webkit-user-select: text; user-select: text; }
  #panel[hidden] { display: none; }
  .pbody { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  .pbody h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  .pbody h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #777; margin: 22px 0 4px; font-weight: 600; }
  #pstats { font-size: 12px; color: #888; line-height: 1.6; white-space: pre-line; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1d1d1d; font-size: 14px; }
  .row label { flex: 1; }
  .row input[type=range] { flex: 1.1; min-width: 0; }
  .row output { width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: #aaa; font-size: 13px; }
  .row input[type=checkbox] { width: 22px; height: 22px; }
  select, button { font: inherit; font-size: 14px; background: #1c1c1c; color: #ddd; border: 1px solid #333; border-radius: 8px; padding: 9px 10px; }
  .pbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 22px; }
  .pbtns .danger { color: #e99; }
  .pbtns .primary { background: #ddd; color: #000; border-color: #ddd; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="stage"></canvas>
<canvas id="ui"></canvas>

<div id="start">
  <div>
    <div class="hint">tocar para iniciar</div>
    <div class="err" id="startErr"></div>
  </div>
  <div class="t">Lo que ibas a hacer</div>
  <div class="ver">v2.3</div>
</div>

<div id="rotate">Girá el teléfono</div>
<div id="hotspot"></div>

<div id="panel" hidden>
  <div class="pbody">
    <h2>Configuración · v2.3</h2>
    <div id="pstats"></div>
    <div id="pform"></div>
    <div class="pbtns">
      <button data-act="fullscreen">Pantalla completa</button>
      <button data-act="reset">Restablecer parámetros</button>
      <button data-act="export">Exportar archivo</button>
      <button data-act="exportSeed">Exportar semilla</button>
      <button data-act="import">Importar archivo</button>
      <button data-act="importSeed">Importar como semilla</button>
      <button data-act="clearVisits" class="danger">Borrar visitas</button>
      <button data-act="clearAll" class="danger">Borrar todo</button>
      <button data-act="close" class="primary" style="grid-column: 1 / -1">Cerrar</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<script>
  // Muestra en pantalla cualquier error, para que la app nunca quede muda.
  (function () {
    var show = function (msg) {
      var el = document.getElementById('startErr'); if (el && !el.textContent) el.textContent = msg;
    };
    window.addEventListener('error', function (e) { show('Error: ' + (e.message || 'no se pudo cargar un archivo de la app')); });
    window.addEventListener('unhandledrejection', function (e) { show('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
    window.__lqiahFail = function () { show('No se pudo cargar app.js, core.js o render.js. Revisá que estén subidos junto a index.html.'); };
    setTimeout(function () { if (!window.__lqiahReady) show('La app no terminó de cargar. Recargá la página; si sigue, el navegador puede ser demasiado viejo.'); }, 10000);
  })();
</script>
<script type="module" src="app.js?v=23" onerror="__lqiahFail()"></script>
</body>
</html>
